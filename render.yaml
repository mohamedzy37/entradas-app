# Despliegue de EntradasYa en Render (https://render.com) como "Blueprint".
#
#   Navegador ──HTTPS──▶ entradas-mohamedzy37.onrender.com  (Static Site: React)
#                          ├── /            ficheros estaticos de la SPA
#                          └── /api/*  ──rewrite──▶ entradas-api-mohamedzy37.onrender.com (FastAPI, Docker)
#                                                       └──▶ entradas-db (PostgreSQL, solo red interna)
#
# El frontend reenvia /api/* a la API (rewrite). Asi el navegador solo ve UN
# origen: la cookie del refresh (SameSite=Strict) funciona igual que en local.
# onrender.com esta en la Public Suffix List, de modo que dos subdominios
# distintos serian "sitios" distintos y la cookie no viajaria.
#
# Si Render asigna otra URL porque el nombre ya existe, actualiza las tres
# apariciones de las URLs: CORS_ORIGINS, GOOGLE_REDIRECT_URI y el rewrite.

databases:
  - name: entradas-db
    plan: free            # gratis 30 dias; despues hay que pasar a un plan de pago
    region: frankfurt
    databaseName: entradas
    user: entradas
    ipAllowList: []       # sin acceso desde Internet: solo los servicios de Render

services:
  # --- API (FastAPI) con el mismo Dockerfile que en Docker Compose ---
  - type: web
    name: entradas-api-mohamedzy37
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: entradas-db
          property: connectionString
      # Secretos generados por Render (aleatorios, distintos entre si).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Origen publico del frontend: CORS y comprobacion de Origin del refresh.
      - key: CORS_ORIGINS
        value: https://entradas-mohamedzy37.onrender.com
      - key: SEED_DEMO_DATA
        value: "true"
      # Login con Google: Render pide los valores al crear el Blueprint.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://entradas-mohamedzy37.onrender.com/api/auth/google/callback

  # --- Frontend (React) como sitio estatico ---
  - type: web
    name: entradas-mohamedzy37
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      # 1) La API: mismo origen para el navegador.
      - type: rewrite
        source: /api/*
        destination: https://entradas-api-mohamedzy37.onrender.com/api/*
      # 2) SPA: cualquier otra ruta sirve index.html (React Router).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Mismas cabeceras de seguridad que el Nginx de Docker Compose.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://picsum.photos https://fastly.picsum.photos; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
