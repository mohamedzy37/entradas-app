# Despliegue de EntradasYa: PostgreSQL + API FastAPI + Nginx (frontend y proxy HTTPS).
#
#   1. Genera el .env con secretos:   powershell -ExecutionPolicy Bypass -File scripts\generar-env.ps1
#   2. Arranca:                        docker compose up -d --build
#   3. Abre:                           https://localhost
#
# Solo Nginx publica puertos. La API y la base de datos no son accesibles desde
# fuera de Docker, y la base de datos esta en una red interna sin salida.

name: entradas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: entradas
      POSTGRES_USER: entradas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ejecuta scripts/generar-env.ps1)}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entradas -d entradas"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://entradas:${POSTGRES_PASSWORD}@db:5432/entradas
      # Origen publico del frontend: CORS y comprobacion de Origin del refresh.
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Falta JWT_REFRESH_SECRET en .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Login con Google (opcional: vacio = desactivado).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Se deriva del origen publico; debe estar autorizada en Google Cloud.
      GOOGLE_REDIRECT_URI: ${PUBLIC_ORIGIN:-https://localhost}/api/auth/google/callback
    networks:
      - db
      - web
    # Endurecimiento del contenedor.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
      TLS_CN: ${TLS_CN:-localhost}
      # Limite anti fuerza bruta de /api/auth/ por IP.
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10r/m}
      # Limite anti DoS de toda la API por IP.
      API_RATE_LIMIT: ${API_RATE_LIMIT:-20r/s}
    volumes:
      # Certificado TLS. Vacio = se genera uno autofirmado al arrancar.
      - tls-certs:/etc/nginx/certs
    networks:
      - web
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Red interna: la base de datos no tiene salida a Internet ni puertos publicados.
  db:
    internal: true
  web: {}

volumes:
  db-data:
  tls-certs:
