# Cabeceras para reenviar peticiones a la API (incluido desde default.conf).
proxy_pass http://api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Se SOBRESCRIBE (no se anade) X-Forwarded-For: el cliente no puede falsear
# su IP enviando la cabecera, y el rate limiting de la API ve la IP real.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
